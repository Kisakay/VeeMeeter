[package]
name = "veemeeter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native PipeWire audio mixer and router (Voicemeeter-like) for Linux"
license = "GPL-3.0-only"
repository = "https://github.com/Kisakay/VeeMeeter"
readme = "README.md"
keywords = ["pipewire", "audio", "mixer", "voicemeeter", "linux"]
categories = ["multimedia::audio"]

[dependencies]
pipewire = "0.10"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
argh = "0.1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
anyhow = "1"
png = "0.18"
# Icône de zone de notification (StatusNotifierItem, D-Bus pur Rust, sans GTK).
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Paquets distro : `cargo deb` (Debian/Ubuntu) et `cargo generate-rpm` (Fedora…),
# lancés par packaging/build.sh dans un conteneur de chaque distribution.
[package.metadata.deb]
maintainer = "Kisakay <kisakay@users.noreply.github.com>"
section = "sound"
priority = "optional"
extended-description = """\
VeeMeeter mixes and routes audio between applications, microphones and \
outputs, Voicemeeter style: virtual inputs and outputs, A/B buses, faders \
in dB, VU meters, per-application routing. It drives PipeWire natively and \
keeps the routing alive in a small user daemon."""
# $auto = libpipewire + libc ; le reste est chargé à l'exécution (dlopen) par la fenêtre.
depends = "$auto, pipewire, wireplumber, libgl1, libegl1, libxkbcommon0, libwayland-client0, libwayland-egl1"
assets = [
    ["target/release/veemeeter", "usr/bin/", "755"],
    ["assets/veemeeter.desktop", "usr/share/applications/", "644"],
    ["assets/veemeeter.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/veemeeter.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/veemeeter/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Native PipeWire audio mixer and router (Voicemeeter-like)"
assets = [
    { source = "target/release/veemeeter", dest = "/usr/bin/veemeeter", mode = "755" },
    { source = "assets/veemeeter.desktop", dest = "/usr/share/applications/veemeeter.desktop", mode = "644" },
    { source = "assets/veemeeter.svg", dest = "/usr/share/icons/hicolor/scalable/apps/veemeeter.svg", mode = "644" },
    { source = "assets/veemeeter.service", dest = "/usr/lib/systemd/user/veemeeter.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/veemeeter/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/veemeeter/LICENSE", mode = "644", doc = true },
]
auto-req = "auto"

[package.metadata.generate-rpm.requires]
pipewire = "*"
wireplumber = "*"
libglvnd-egl = "*"
libxkbcommon = "*"
libwayland-client = "*"
libwayland-egl = "*"
