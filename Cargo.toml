[package]
name = "veemeeter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native PipeWire audio mixer and router (Voicemeeter-like) for Linux"
license = "GPL-3.0-only"
repository = "https://github.com/Kisakay/VeeMeeter"
readme = "README.md"
keywords = ["pipewire", "audio", "mixer", "voicemeeter", "linux"]
categories = ["multimedia::audio"]

[dependencies]
pipewire = "0.10"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
argh = "0.1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
anyhow = "1"
png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
