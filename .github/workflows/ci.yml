name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "branding/**", "mkdocs.yml", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix (flake check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs .#veemeeter
      # Binaire précompilé de la dernière release (s'il est déclaré) : patchelf seulement.
      - run: if [ -f nix/bin.json ]; then nix build --print-build-logs .#veemeeter-bin && ./result/bin/veemeeter --help; fi
      - run: ./result/bin/veemeeter --help

  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 13",       image: "debian:trixie",   family: debian }
          - { name: "Ubuntu 24.04 LTS", image: "ubuntu:24.04",   family: ubuntu }
          - { name: "Ubuntu latest",   image: "ubuntu:rolling",  family: ubuntu }
          - { name: "Fedora latest",   image: "fedora:latest",   family: fedora }
          - { name: "Arch Linux",      image: "archlinux:latest", family: arch }
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.family }}
          key: ${{ matrix.image }}-${{ hashFiles('Cargo.lock') }}
      - name: Build, test, package
        run: packaging/build.sh ${{ matrix.family }}
        env:
          CARGO_BUILD_JOBS: "4"
      - uses: actions/upload-artifact@v4
        with:
          name: veemeeter-${{ matrix.family }}-${{ strategy.job-index }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, distro]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Les releases sont immuables : tout est vérifié AVANT de publier.
      - name: Tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes and checksums
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          ls dist/*.deb dist/*.rpm dist/*.tar.gz
          # Archive téléchargée par le paquet Nix `veemeeter-bin` (flake) :
          # elle doit être dans la release, qui ne pourra plus changer.
          test -f "dist/veemeeter-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz"
          # GitHub remplace « ~ » par « . » dans les noms des fichiers joints :
          # on renomme avant de calculer SHA256SUMS pour que `sha256sum -c` marche.
          for f in dist/*~*; do [ -e "$f" ] && mv -- "$f" "${f//\~/.}"; done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "VeeMeeter $GITHUB_REF_NAME" --notes-file notes.md
      # Le flake télécharge ce binaire au lieu de compiler (paquet `veemeeter-bin`,
      # défaut des modules NixOS / home-manager) : on lui donne URL et hash.
      - name: Point the Nix flake at this release's binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="veemeeter-$version-linux-x86_64.tar.gz"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file"
          hash="sha256-$(openssl dgst -sha256 -binary "dist/$file" | base64)"
          # Ce que GitHub sert doit être exactement ce qu'on a haché.
          served="sha256-$(curl -fsSL "$url" | openssl dgst -sha256 -binary | base64)"
          if [ "$served" != "$hash" ]; then
            echo "::error::$url does not match the built archive ($served != $hash)"
            exit 1
          fi
          git fetch origin main
          git switch -c nix-bin FETCH_HEAD
          printf '{\n  "version": "%s",\n  "url": "%s",\n  "hash": "%s"\n}\n' "$version" "$url" "$hash" > nix/bin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/bin.json
          git commit -m "chore(nix): binaire précompilé v$version pour le flake"
          git push origin HEAD:main
