site_name: VeeMeeter
site_url: https://veemeter.v.bzh/
site_description: A cute, native PipeWire virtual audio mixer and router for Linux, written in Rust.
site_author: VeeMeeter contributors
repo_url: https://github.com/Kisakay/VeeMeeter
repo_name: Kisakay/VeeMeeter
edit_uri: edit/main/docs/
copyright: VeeMeeter is free software under the GPL-3.0-only licence · Mimi the mascot is part of the VeeMeeter brand kit

# docs/assets/brand is a symlink to ../../branding (single source for the kit).
exclude_docs: |
  assets/brand/README.md
  assets/brand/src/
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/brand/logo/mark-small.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Nunito
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    admonition:
      note: material/music-note
      tip: material/star-four-points
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kisakay/VeeMeeter

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: concepts.md
  - Guides:
      - GUI guide: gui.md
      - CLI reference: cli.md
      - Configuration: configuration.md
  - Why VeeMeeter?: comparison.md
  - Troubleshooting & FAQ: faq.md
  - Project:
      - Branding kit: branding.md
      - Contributing: contributing.md
